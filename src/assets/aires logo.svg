<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 380 110"
     width="380"
     height="110"
     role="img"
     aria-labelledby="title desc">
  <title id="title">AIRES — AI-Powered Reliable Evidence System</title>
  <desc id="desc">The AIRES logo, consisting of a four-square mark in gold and blue alongside the AIRES wordmark and tagline.</desc>

  <!-- Logo Mark: 2x2 checkerboard of gold and sky -->
  <g transform="translate(22, 28)">
    <rect x="0"  y="0"  width="24" height="24" fill="#C9A961"/>
    <rect x="30" y="0"  width="24" height="24" fill="#0369A1"/>
    <rect x="0"  y="30" width="24" height="24" fill="#0369A1"/>
    <rect x="30" y="30" width="24" height="24" fill="#C9A961"/>
  </g>

  <!-- Wordmark: AIRES -->
  <text x="104"
        y="65"
        font-family="'Poppins', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif"
        font-size="44"
        font-weight="700"
        fill="#0369A1"
        letter-spacing="4">AIRES</text>

  <!-- Tagline -->
  <text x="106"
        y="83"
        font-family="'Lora', 'Georgia', 'Times New Roman', serif"
        font-size="11"
        font-style="italic"
        fill="#0369A1"
        letter-spacing="0.3">AI-Powered Reliable Evidence System</text>
</svg>
